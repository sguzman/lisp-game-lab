name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Resolve and record Nix lock
        run: |
          nix flake lock
          cat flake.lock
          git ls-files --error-unmatch flake.lock
          git diff --exit-code HEAD -- flake.lock
      - run: nix develop -c make check
      - name: Compile playground
        run: nix develop -c sbcl --noinform --non-interactive --eval '(require :asdf)' --eval '(asdf:load-asd (truename "lisp-game-lab.asd"))' --eval '(asdf:load-system "lisp-game-lab/playground")'
      - name: Compile rendering experiment
        run: nix develop -c sbcl --noinform --non-interactive --eval '(require :asdf)' --eval '(asdf:load-asd (truename "lisp-game-lab.asd"))' --eval '(asdf:load-system "lisp-game-lab/rendering")'
      - name: Compile live code experiment
        run: nix develop -c sbcl --noinform --non-interactive --eval '(require :asdf)' --eval '(asdf:load-asd (truename "lisp-game-lab.asd"))' --eval '(asdf:load-system "lisp-game-lab/live")'
      - name: Compile live asset experiment
        run: nix develop -c sbcl --noinform --non-interactive --eval '(require :asdf)' --eval '(asdf:load-asd (truename "lisp-game-lab.asd"))' --eval '(asdf:load-system "lisp-game-lab/live-assets")'
      - name: Compile interactive console experiment
        run: nix develop -c sbcl --noinform --non-interactive --eval '(require :asdf)' --eval '(asdf:load-asd (truename "lisp-game-lab.asd"))' --eval '(asdf:load-system "lisp-game-lab/interactive")'
      - name: Compile object experiment
        run: nix develop -c sbcl --noinform --non-interactive --eval '(require :asdf)' --eval '(asdf:load-asd (truename "lisp-game-lab.asd"))' --eval '(asdf:load-system "lisp-game-lab/objects")'
      - name: Compile declarative room experiment
        run: nix develop -c sbcl --noinform --non-interactive --eval '(require :asdf)' --eval '(asdf:load-asd (truename "lisp-game-lab.asd"))' --eval '(asdf:load-system "lisp-game-lab/rooms")'
      - name: Virtual display smoke
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX' nix develop .#ci -c make smoke
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX' nix develop .#ci -c sh -eu -c 'for i in 1 2 3 4 5; do echo "Rendering trial $i/5"; make render-smoke; done'
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX' nix develop .#ci -c make live-smoke
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX' nix develop .#ci -c env ALSA_CONFIG_PATH="$PWD/scripts/alsa-null.conf" make assets-smoke
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX' nix develop .#ci -c make console-smoke
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX' nix develop .#ci -c make objects-smoke
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX' nix develop .#ci -c make rooms-smoke
